name: 部署 huayuan-crm 到腾讯云

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  quality-and-deploy:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 1. Backend unit tests
        run: npm run test -w backend -- --runInBand

      - name: 2. Backend integration tests
        run: npm run test:e2e -w backend -- --runInBand

      - name: 3. Frontend type check
        run: npm run typecheck -w frontend

      - name: 4. Frontend tests
        run: npm run test -w frontend

      - name: 5. Build backend and frontend
        run: npm run build

      - name: 6. Database migration check
        run: npm run db:migrate:check -w backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Validate rollback-safe deployment script
        run: |
          bash -n deploy/remote-deploy.sh
          node --test deploy/remote-deploy.test.mjs

      - name: Package artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p deploy-artifacts/backend deploy-artifacts/frontend
          cp -r backend/dist deploy-artifacts/backend/
          cp backend/package.json deploy-artifacts/backend/
          cp -r frontend/dist deploy-artifacts/frontend/
          cp frontend/package.json deploy-artifacts/frontend/
          cp package.json deploy-artifacts/
          cp package-lock.json deploy-artifacts/
          cp ecosystem.config.js deploy-artifacts/
          cp deploy/nginx-huayuan-crm.conf deploy-artifacts/
          cp deploy/remote-deploy.sh deploy-artifacts/

      - name: Upload to Tencent Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: 'deploy-artifacts/*'
          target: ${{ secrets.SERVER_PROJECT_PATH }}/releases/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          strip_components: 1

      - name: 7. Deploy to Tencent Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_ROOT: ${{ secrets.SERVER_PROJECT_PATH }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          PORT: 9528
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || 3306 }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN || '7d' }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS || 'https://crm.huayuanflange.com' }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || 'https://crm.huayuanflange.com' }}
          BACKUP_DIR: ${{ secrets.BACKUP_DIR || '/var/backups/huayuan-crm' }}
          INITIAL_ADMIN_USERNAME: ${{ secrets.INITIAL_ADMIN_USERNAME }}
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL || 'https://api.deepseek.com/v1' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: APP_ROOT,RELEASE_ID,PORT,DB_HOST,DB_PORT,DB_USERNAME,DB_PASSWORD,DB_DATABASE,JWT_SECRET,CREDENTIAL_ENCRYPTION_KEY,JWT_EXPIRES_IN,CORS_ORIGINS,PUBLIC_BASE_URL,BACKUP_DIR,INITIAL_ADMIN_USERNAME,INITIAL_ADMIN_PASSWORD,DEEPSEEK_API_KEY,DEEPSEEK_BASE_URL
          script: |
            set -e
            chmod +x "$APP_ROOT/releases/$RELEASE_ID/remote-deploy.sh"
            bash "$APP_ROOT/releases/$RELEASE_ID/remote-deploy.sh"

      - name: 8. Production health check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node deploy/health-check.mjs
        env:
          HEALTHCHECK_URL: ${{ secrets.PUBLIC_BASE_URL || 'https://crm.huayuanflange.com' }}
