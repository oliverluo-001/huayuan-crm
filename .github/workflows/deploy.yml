name: 部署 huayuan-crm 到腾讯云

on:
  push:
    branches: ['main']

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Package artifacts
        run: |
          mkdir -p deploy-artifacts/backend deploy-artifacts/frontend
          cp -r backend/dist deploy-artifacts/backend/
          cp backend/package.json deploy-artifacts/backend/
          cp -r frontend/dist deploy-artifacts/frontend/
          cp package.json deploy-artifacts/
          cp ecosystem.config.js deploy-artifacts/

      - name: Upload to Tencent Cloud
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: 'deploy-artifacts/*'
          target: ${{ secrets.SERVER_PROJECT_PATH }}
          strip_components: 1

      - name: Remote deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            DEPLOY_DIR=${{ secrets.SERVER_PROJECT_PATH }}
            cd $DEPLOY_DIR

            # ----- 后端部署 -----
            # 写入生产环境配置
            cat > backend/.env << EOF
            PORT=9528
            NODE_ENV=production
            DB_TYPE=mysql
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT || 3306 }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_SYNCHRONIZE=false
            DB_LOGGING=false
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN || '7d' }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            DEEPSEEK_BASE_URL=${{ secrets.DEEPSEEK_BASE_URL || 'https://api.deepseek.com/v1' }}
            EOF

            # 安装生产依赖
            cd backend
            npm install --omit=dev

            # 使用 PM2 ecosystem 启动/重启
            cd $DEPLOY_DIR
            pm2 describe huayuan-crm-backend > /dev/null 2>&1 \
              && pm2 restart ecosystem.config.js \
              || pm2 start ecosystem.config.js
            pm2 save

            # ----- 前端部署 -----
            cd $DEPLOY_DIR
            sudo rm -rf /var/www/huayuan-crm/html
            sudo mkdir -p /var/www/huayuan-crm/html
            sudo cp -r frontend/dist/* /var/www/huayuan-crm/html/
            sudo chown -R nginx:nginx /var/www/huayuan-crm/html

            # ----- Nginx 配置 -----
            NGINX_CONF=/etc/nginx/conf.d/huayuan-crm.conf
            sudo tee $NGINX_CONF > /dev/null << 'NGINX'
# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name crm.huayuanflange.com www.crm.huayuanflange.com;
    return 301 https://crm.huayuanflange.com$request_uri;
}

# HTTPS www → 非 www 重定向
server {
    listen 443 ssl http2;
    server_name www.crm.huayuanflange.com;
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    return 301 https://crm.huayuanflange.com$request_uri;
}

# 主站点（非 www）
server {
    listen 443 ssl http2;
    server_name crm.huayuanflange.com;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Cloudflare 真实 IP 还原
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    root /var/www/huayuan-crm/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9528;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
NGINX

            sudo nginx -t && sudo systemctl reload nginx

            # 清理临时文件
            rm -rf $DEPLOY_DIR/backend/node_modules/.cache
            rm -rf $DEPLOY_DIR/package.json

            echo "===== Deploy to Tencent Cloud complete ====="
